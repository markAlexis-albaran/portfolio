<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <!-- Recreated for this portfolio: one reader component, three brand token sets -->
  <rect width="1600" height="1000" fill="#1a1a1a"/>
  <text x="80" y="92" fill="#ffffff" fill-opacity="0.6" font-family="Menlo, monospace" font-size="20">One component · three brand token sets · recreated for this portfolio</text>

  <!-- Brand 1: Kochzeit (food) -->
  <g transform="translate(80 140)">
    <text x="0" y="0" fill="#ffffff" font-family="Menlo, monospace" font-size="20">Kochzeit</text>
    <rect y="24" width="440" height="560" rx="14" fill="#fffaf2"/>
    <rect y="24" width="440" height="64" rx="14" fill="#c8532b"/>
    <rect y="74" width="440" height="14" fill="#c8532b"/>
    <text x="28" y="66" fill="#fffaf2" font-family="Georgia, serif" font-size="26" font-style="italic">Kochzeit</text>
    <rect x="28" y="112" width="384" height="200" rx="10" fill="#f0d9bf"/>
    <circle cx="220" cy="212" r="58" fill="#e4b98f"/>
    <rect x="28" y="336" width="96" height="30" rx="15" fill="#c8532b" fill-opacity="0.14"/>
    <text x="44" y="357" fill="#c8532b" font-size="15" font-weight="bold">REZEPT</text>
    <text x="28" y="408" fill="#2b1d14" font-family="Georgia, serif" font-size="30">Herbstsuppe in</text>
    <text x="28" y="446" fill="#2b1d14" font-family="Georgia, serif" font-size="30">20 Minuten</text>
    <rect x="28" y="490" width="160" height="52" rx="26" fill="#c8532b"/>
    <text x="108" y="523" fill="#fffaf2" font-size="18" font-weight="bold" text-anchor="middle">Zum Rezept</text>
  </g>

  <!-- Brand 2: Sternblick (celebrity) -->
  <g transform="translate(580 140)">
    <text x="0" y="0" fill="#ffffff" font-family="Menlo, monospace" font-size="20">Sternblick</text>
    <rect y="24" width="440" height="560" rx="2" fill="#ffffff"/>
    <rect y="24" width="440" height="64" rx="2" fill="#111111"/>
    <text x="28" y="68" fill="#ff2d6f" font-size="28" font-weight="bold" letter-spacing="4">STERNBLICK</text>
    <rect x="28" y="112" width="384" height="200" rx="2" fill="#2a2a2e"/>
    <circle cx="220" cy="196" r="44" fill="#4a4a52"/>
    <rect x="160" y="246" width="120" height="66" rx="40" fill="#4a4a52"/>
    <rect x="28" y="336" width="104" height="30" rx="2" fill="#ff2d6f"/>
    <text x="44" y="357" fill="#ffffff" font-size="15" font-weight="bold">EXKLUSIV</text>
    <text x="28" y="408" fill="#111111" font-size="30" font-weight="bold">Das große Comeback</text>
    <text x="28" y="446" fill="#111111" font-size="30" font-weight="bold">des Jahres</text>
    <rect x="28" y="490" width="170" height="52" rx="2" fill="#111111"/>
    <text x="113" y="523" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">Weiterlesen</text>
  </g>

  <!-- Brand 3: Fernweg (travel) -->
  <g transform="translate(1080 140)">
    <text x="0" y="0" fill="#ffffff" font-family="Menlo, monospace" font-size="20">Fernweg</text>
    <rect y="24" width="440" height="560" rx="24" fill="#eef4f3"/>
    <rect y="24" width="440" height="64" rx="24" fill="#1f6f6a"/>
    <rect y="74" width="440" height="14" fill="#1f6f6a"/>
    <text x="28" y="66" fill="#eef4f3" font-size="26" letter-spacing="1">fernweg</text>
    <rect x="28" y="112" width="384" height="200" rx="18" fill="#bcd9d5"/>
    <path d="M28 280 L140 200 L220 262 L300 186 L412 280 L412 294 Q412 312 394 312 L46 312 Q28 312 28 294 Z" fill="#7fb3ad"/>
    <rect x="28" y="336" width="110" height="30" rx="15" fill="#1f6f6a" fill-opacity="0.14"/>
    <text x="44" y="357" fill="#1f6f6a" font-size="15" font-weight="bold">REISEN</text>
    <text x="28" y="408" fill="#16302e" font-size="30">Drei Tage an der</text>
    <text x="28" y="446" fill="#16302e" font-size="30">Ostsee</text>
    <rect x="28" y="490" width="176" height="52" rx="26" fill="#1f6f6a"/>
    <text x="116" y="523" fill="#eef4f3" font-size="18" font-weight="bold" text-anchor="middle">Zur Reise</text>
  </g>

  <!-- Token rows -->
  <g font-family="Menlo, monospace" font-size="18" fill="#ffffff">
    <text x="80" y="800" fill-opacity="0.6">color.brand</text>
    <text x="80" y="840" fill-opacity="0.6">font.headline</text>
    <text x="80" y="880" fill-opacity="0.6">radius.card</text>
    <text x="80" y="920" fill-opacity="0.6">radius.button</text>

    <text x="420" y="800">#C8532B</text><text x="420" y="840">Serif</text><text x="420" y="880">14</text><text x="420" y="920">26</text>
    <text x="790" y="800">#FF2D6F</text><text x="790" y="840">Sans, bold</text><text x="790" y="880">2</text><text x="790" y="920">2</text>
    <text x="1180" y="800">#1F6F6A</text><text x="1180" y="840">Sans, regular</text><text x="1180" y="880">24</text><text x="1180" y="920">26</text>
  </g>
  <line x1="80" y1="770" x2="1520" y2="770" stroke="#ffffff" stroke-opacity="0.18"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Helvetica, Arial, sans-serif">
  <!-- Recreated for this portfolio: block editor where editors write, save, publish and schedule in one place -->
  <rect width="1600" height="1000" fill="#1a1a1a"/>
  <text x="80" y="92" fill="#ffffff" fill-opacity="0.6" font-family="Menlo, monospace" font-size="20">Write, save, publish and schedule in one place · recreated for this portfolio</text>

  <!-- Window -->
  <rect x="80" y="130" width="1440" height="790" rx="16" fill="#ffffff"/>
  <rect x="80" y="130" width="1440" height="64" rx="16" fill="#f4f4f5"/>
  <rect x="80" y="178" width="1440" height="16" fill="#f4f4f5"/>
  <circle cx="116" cy="162" r="7" fill="#d4d4d8"/><circle cx="140" cy="162" r="7" fill="#d4d4d8"/><circle cx="164" cy="162" r="7" fill="#d4d4d8"/>
  <text x="200" y="169" fill="#18181b" font-size="19" font-weight="bold">Columna</text>
  <text x="300" y="169" fill="#71717a" font-size="17">Kochzeit · Rezepte</text>
  <circle cx="1022" cy="162" r="6" fill="#22a06b"/>
  <text x="1036" y="168" fill="#52525b" font-size="16">Draft saved</text>
  <rect x="1150" y="144" width="150" height="38" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="1225" y="169" fill="#18181b" font-size="16" text-anchor="middle">Schedule</text>
  <rect x="1316" y="144" width="174" height="38" rx="8" fill="#18181b"/>
  <text x="1403" y="169" fill="#ffffff" font-size="16" text-anchor="middle" font-weight="bold">Publish</text>

  <!-- Editor canvas -->
  <text x="200" y="290" fill="#18181b" font-size="44" font-weight="bold">Herbstsuppe in 20 Minuten</text>
  <text x="200" y="336" fill="#71717a" font-size="20">Kürbis, Ingwer und Kokos: ein Rezept für kalte Abende.</text>

  <rect x="200" y="372" width="620" height="210" rx="10" fill="#f0d9bf"/>
  <circle cx="510" cy="477" r="62" fill="#e4b98f"/>
  <text x="166" y="482" fill="#a1a1aa" font-size="22">⋮⋮</text>

  <rect x="200" y="612" width="760" height="14" rx="7" fill="#e4e4e7"/>
  <rect x="200" y="640" width="700" height="14" rx="7" fill="#e4e4e7"/>
  <rect x="200" y="668" width="560" height="14" rx="7" fill="#e4e4e7"/>

  <!-- Slash menu -->
  <text x="200" y="730" fill="#18181b" font-size="22">/</text>
  <rect x="200" y="748" width="340" height="150" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-size="18" fill="#18181b">
    <rect x="208" y="756" width="324" height="40" rx="6" fill="#f4f4f5"/>
    <text x="232" y="783">Heading</text>
    <text x="232" y="823">Image</text>
    <text x="232" y="863">Recipe card</text>
  </g>
  <g font-family="Menlo, monospace" font-size="14" fill="#a1a1aa">
    <text x="512" y="783" text-anchor="end">H2</text>
    <text x="512" y="823" text-anchor="end">IMG</text>
    <text x="512" y="863" text-anchor="end">BLOCK</text>
  </g>

  <!-- Schedule panel -->
  <rect x="1100" y="228" width="390" height="370" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="1128" y="270" fill="#18181b" font-size="20" font-weight="bold">Schedule publishing</text>
  <text x="1128" y="312" fill="#71717a" font-size="16">Date</text>
  <rect x="1128" y="324" width="334" height="46" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="1146" y="354" fill="#18181b" font-size="18">Fri, 12 March</text>
  <text x="1128" y="404" fill="#71717a" font-size="16">Time</text>
  <rect x="1128" y="416" width="334" height="46" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="1146" y="446" fill="#18181b" font-size="18">08:00</text>
  <rect x="1128" y="500" width="334" height="50" rx="8" fill="#18181b"/>
  <text x="1295" y="532" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">Schedule</text>
</svg>

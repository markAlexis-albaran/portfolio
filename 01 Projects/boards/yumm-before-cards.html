<!doctype html><html lang="en"><head><meta charset="utf-8"><title>yumm before: product card (wireframe)</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="yumm-before.css">
<style>.pc{text-align:center}.pc .row{display:flex;gap:10px;align-items:center;margin-top:10px;text-align:left}.pc .img{width:80px;height:52px;flex-shrink:0}.pl{display:flex;align-items:center;gap:6px;margin-top:6px}.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid #8a8a8a;flex-shrink:0}.fab{position:absolute;right:14px;bottom:30px;width:40px;height:40px;border-radius:50%;background:#7a7a7a}.fabl{position:absolute;right:6px;bottom:12px;font-size:7px;font-weight:500;color:#555;text-align:center;width:56px}</style></head>
<body><div class="phone"><div class="screen pc">
  <p class="lbl" style="text-align:left;margin-top:16px;font-size:6px">Affiliate link</p>
  <div style="text-align:left;margin-top:4px"><span class="badge">Top pick</span></div>
  <div class="row"><div class="img"></div><div style="flex:1"><div class="line dark"></div><div class="line dark" style="width:70%"></div><p class="lbl" style="margin-top:8px">€ ——</p><div class="line light" style="width:40%"></div><div class="btn">To the product</div></div></div>
  <p class="lbl" style="margin-top:14px">More sellers:</p>
  <div style="display:flex;gap:10px;align-items:center;margin-top:4px"><div class="line light" style="width:30%;margin:0"></div><div class="btn" style="flex:1;margin:0">To the product</div></div>
  <p class="lbl" style="margin-top:14px">Our rating:</p><p class="stars" style="margin-top:4px">★★★★★ <span class="lbl">4.8 / 5</span></p>
  <p class="lbl" style="margin-top:14px;text-align:left">Pros</p>
  <div class="pl"><span class="dot"></span><div class="line" style="width:40%;margin:0"></div></div><div class="pl"><span class="dot"></span><div class="line" style="width:30%;margin:0"></div></div>
  <p class="lbl" style="margin-top:12px;text-align:left">Cons</p>
  <div class="pl"><span class="dot"></span><div class="line" style="width:35%;margin:0"></div></div><div class="pl"><span class="dot"></span><div class="line" style="width:45%;margin:0"></div></div>
  <span class="fab"></span><span class="fabl">Jump to best price</span>
</div></div></body></html>
